<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример формы регистрации сайта</title>
</head>
<body>

    <h2>Пример формы регистрации сайта</h2>

    <form action="#" method="post" enctype="multipart/form-data">
        <p>
            <label for="login">Логин:</label><br>
            <input type="text" id="login" name="login" size="20">
        </p>
        <p>
            <label for="pass">Пароль:</label><br>
            <input type="password" id="pass" name="password" size="20">
        </p>
        <p>
            <label for="url">URL-адрес сайта:</label><br>
            <input type="url" id="url" name="url" value="http://" size="20">
        </p>
        <p>
            <label for="sitename">Название сайта:</label><br>
            <input type="text" id="sitename" name="sitename" size="20">
        </p>
        <p>
            <label for="description">Описание сайта:</label><br>
            <textarea id="description" name="description" rows="8" cols="50"></textarea>
        </p>
        <p>
            <label for="theme">Тема сайта:</label><br>
            <select id="theme" name="theme">
                <option value="none">Тема не выбрана</option>
                <option value="science">Наука</option>
                <option value="art">Искусство</option>
                <option value="sport">Спорт</option>
                <option value="tech">Технологии</option>
            </select>
        </p>
        <p>
            <label for="banner">Баннер 88x31:</label><br>
            <input type="file" id="banner" name="banner" accept="image/*">
        </p>
        <p>
            <input type="reset" value="Очистить">
            <input type="submit" value="Отправить">
        </p>
    </form>

</body>
</html>
